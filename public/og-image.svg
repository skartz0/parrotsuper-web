    <text x="-215" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#34d399" text-anchor="middle">⚡ &lt; 60 sec Install</text>

